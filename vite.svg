<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1e293b"/>
      <stop offset="100%" stop-color="#0f172a"/>
    </linearGradient>
  </defs>
  <!-- Background squircle -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  <!-- Subtle accent border -->
  <rect x="1" y="1" width="62" height="62" rx="15" fill="none" stroke="#facc15" stroke-width="2" stroke-opacity="0.4"/>
  <!-- RY. monogram -->
  <text x="31" y="42" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'DM Sans', sans-serif" font-size="25" font-weight="900" text-anchor="middle" letter-spacing="-1">
    <tspan fill="#ffffff">RY</tspan><tspan fill="#facc15">.</tspan>
  </text>
